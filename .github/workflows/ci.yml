name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Qazza1/onchaindiligence
          ref: b04a503a275abc865b424b83f5595e2c07591d1d
          path: .d42-core
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .d42-core
      - run: npm pack --workspace @onchaindiligence/agent-evidence --pack-destination "${RUNNER_TEMP}"
        working-directory: .d42-core
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund "${RUNNER_TEMP}/onchaindiligence-agent-evidence-0.3.0.tgz"
      - run: npm run build
      - run: npx tsc -p tsconfig.examples.json
      - run: npm test
        env:
          OCD_AGENT_EVIDENCE_TARBALL: ${{ runner.temp }}/onchaindiligence-agent-evidence-0.3.0.tgz
